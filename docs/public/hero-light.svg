<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -14 512 448" role="img" aria-label="A paragraph clamped to three lines with a Read more button, above the same paragraph expanded with a Read less button">

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
        <!-- collapsed -->
        <text x="40" y="44" fill="#8a857b" letter-spacing="1.2">01 · COLLAPSED · LINES: 3</text>
        <rect x="40" y="58" width="400" height="128" rx="4" fill="#ffffff" stroke="#e6e2da"/>
        <g fill="#1a1917">
            <rect x="60" y="80" width="360" height="7" rx="3.5" opacity="0.78"/>
            <rect x="60" y="102" width="344" height="7" rx="3.5" opacity="0.78"/>
            <rect x="60" y="124" width="196" height="7" rx="3.5" opacity="0.78"/>
        </g>
        <text x="264" y="131" fill="#1a1917" font-size="14" font-weight="700">…</text>
        <g>
            <rect x="60" y="148" width="92" height="24" rx="3" fill="none" stroke="#2745cf"/>
            <text x="72" y="164" fill="#2745cf" font-weight="600">Read more</text>
        </g>
        <text x="392" y="164" text-anchor="end" fill="#8a857b" font-size="10">aria-expanded="false"</text>

        <!-- expanded -->
        <text x="40" y="232" fill="#8a857b" letter-spacing="1.2">02 · EXPANDED</text>
        <rect x="40" y="246" width="400" height="148" rx="4" fill="#ffffff" stroke="#2745cf"/>
        <g fill="#1a1917">
            <rect x="60" y="266" width="360" height="7" rx="3.5" opacity="0.78"/>
            <rect x="60" y="284" width="344" height="7" rx="3.5" opacity="0.78"/>
            <rect x="60" y="302" width="352" height="7" rx="3.5" opacity="0.78"/>
            <rect x="60" y="320" width="330" height="7" rx="3.5" opacity="0.78"/>
            <rect x="60" y="338" width="196" height="7" rx="3.5" opacity="0.78"/>
        </g>
        <g>
            <rect x="60" y="356" width="88" height="24" rx="3" fill="#2745cf"/>
            <text x="72" y="372" fill="#ffffff" font-weight="600">Read less</text>
        </g>
        <text x="392" y="372" text-anchor="end" fill="#8a857b" font-size="10">aria-expanded="true"</text>
    </g>

    <!-- link between the two states -->
    <path d="M240 190 L240 226" stroke="#2745cf" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
    <path d="M235 219 L240 226 L245 219" stroke="#2745cf" stroke-width="1.2" fill="none"/>
</svg>
