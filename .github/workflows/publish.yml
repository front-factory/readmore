name: CI

on:
  push:
    branches: [ "main", "develop", "beta" ]
  pull_request:
    branches: [ "main", "develop", "beta" ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # Every version the published `engines` field promises. fail-fast is off so
    # a break on one version still reports the others.
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24 ]

    # Superseded runs on the same branch are cancelled. The group includes the
    # matrix version so the legs of a single run never cancel each other.
    # Scoped to this job on purpose: an in-flight release must never be killed.
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.node }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      # Lint results don't depend on the Node version, and the shared ESLint
      # config requires Node >=24, so lint on that leg only.
      - name: Lint
        if: matrix.node == 24
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The build only runs via `prepack` at publish time, so check it here too.
      - name: Build
        run: npm run build

      # Keeps the size advertised in the README honest (~1.3 KB gzipped).
      - name: Bundle Size
        if: matrix.node == 24
        run: node -e "const s = require('zlib').gzipSync(require('fs').readFileSync('dist/readmore.js')).length; console.log(s + ' B gzipped (limit 1500 B)'); if (s > 1500) process.exit(1);"

      - name: Tests
        run: npm run test

      - name: Tests Reporter
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Tests (Node ${{ matrix.node }})
          path: junit.xml
          reporter: java-junit

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
